[env:lilygo-t-embed-cc1101-plus]
board = lilygo-t-embed-cc1101
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/lilygo-t-embed-cc1101>
	-<modules/ethernet/EthernetHelper.cpp>
	-<modules/gps/>
	-<modules/fm/>
	-<modules/lora/>
	-<modules/rfid/RFID2.cpp>
	-<modules/rfid/ST25R3916.cpp>
	-<modules/rfid/rfid125.cpp>
	-<modules/rfid/PN532KillerTools.cpp>
	-<modules/others/ibutton.cpp>
	-<modules/rfid/amiibo.cpp>
	-<modules/rfid/chameleon.cpp>
	-<modules/rfid/pn532ble.cpp>
	-<core/menu_items/LoRaMenu.cpp>
	-<core/menu_items/EthernetMenu.cpp>
	-<core/menu_items/GpsMenu.cpp>
	-<core/menu_items/FMMenu.cpp>
build_flags =
	${env.build_flags}
	-DBRUCE_TEMBED_PLUS
	-DDISABLE_LORA
	-DDISABLE_ETHERNET
	-DDISABLE_GPS
	-DDISABLE_FM
	-DDISABLE_RFID125
	-DDISABLE_IBUTTON
	-DDISABLE_PN532_UART
	-DDISABLE_RC522
	-DDISABLE_ST25R3916
	-DDISABLE_M5_RFID2
	-DDISABLE_AMIIBOLINK
	-DDISABLE_CHAMELEON
	-DDISABLE_PN532_BLE
	-Iboards/lilygo-t-embed-cc1101
	-O2
	-D_IR_ENABLE_DEFAULT_=true
	-DMIC_SPM1423
	-DCORE_DEBUG_LEVEL=1
	-DRF_TX_PINS='{{"CC1101", -1}}'
	-DRF_RX_PINS='{{"CC1101", -1}}'
	-DIR_TX_PINS='{{"Default", 2}}'
	-DIR_RX_PINS='{{"Default", 1}}'
	-DDEVICE_NAME='"Lilygo T-Embed CC1101 Plus"'
lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @^0.3.3
lib_ignore =
	TinyGPSPlus
	Adafruit Si4713 Library
	Arduino_MFRC522v2
